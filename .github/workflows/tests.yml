name: C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev clang-format clang-tidy

      - name: Check coding style
        run: |
          clang-format --dry-run --Werror \
            01.InplaceSorting/*.cpp 01.InplaceSorting/*.h \
            02.Base85/*.cpp 02.Base85/*.h \
            03.Gauss/*.cpp 03.Gauss/*.h

      - name: Run static analyzer
        run: |
          clang-tidy \
            01.InplaceSorting/*.cpp \
            02.Base85/*.cpp \
            03.Gauss/*.cpp \
            -- -std=c++17 -I/usr/include/eigen3

      - name: Build and test inplace sorting
        run: |
          cd 01.InplaceSorting
          make clean || true
          make
          ./sort_demo
          ./sort_test

      - name: Build and test Base85
        run: |
          cd 02.Base85
          make clean || true
          make
          ./base85ed_test

      - name: Build and test Gauss
        run: |
          cd 03.Gauss
          make clean || true
          make
          ./Gauss_test
          ./Gauss_main AB.csv
          ./integration_test.sh
